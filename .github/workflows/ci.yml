name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.10.3"
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy

      - name: Test
        run: uv run pytest

      - name: Build
        run: uv build --all-packages

      - name: Verify distributions
        run: |
          test "$(find dist -name '*.whl' | wc -l)" -eq 3
          for package in stim_ai stim_serve stim_systemone; do
            ls dist/${package}-*.whl >/dev/null
          done
          uv venv /tmp/stim-wheels
          uv pip install --python /tmp/stim-wheels/bin/python --no-deps dist/*.whl
          /tmp/stim-wheels/bin/python -c "import stim_systemone, stim_ai, stim_serve"
