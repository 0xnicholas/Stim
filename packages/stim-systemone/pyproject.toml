[project]
name = "stim-systemone"
version = "0.1.0"
description = "System One wire protocol, rendering, and derived quantities for Stim."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.12",
]

[project.scripts]
stim-systemone = "stim_systemone.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stim_systemone"]

[tool.hatch.build.targets.sdist.force-include]
"../../LICENSE" = "LICENSE"
"../../NOTICE" = "NOTICE"
