[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "packaging>=24",
    "pytest>=8.3",
    "ruff>=0.8",
    "typesafe-sdk==0.7.5",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]
src = [
    "packages/stim-systemone/src",
    "packages/stim-ai/src",
    "packages/stim-serve/src",
    "tests",
]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "packages/stim-systemone/src",
    "packages/stim-ai/src",
    "packages/stim-serve/src",
    "tests",
]
mypy_path = [
    "packages/stim-systemone/src",
    "packages/stim-ai/src",
    "packages/stim-serve/src",
]
explicit_package_bases = true
